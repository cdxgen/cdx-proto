name: Verify actions lock

# Calls the shared lockfile verification from cdxgen/.github, pinned by
# commit. A lockfile does not cover reusable workflow calls, so this caller
# itself stays pinned by commit, and Renovate moves the pin together with
# the shared workflow's own lockfile.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - '**/action.y*ml'
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - '**/action.y*ml'

permissions:
  contents: read

jobs:
  verify:
    uses: cdxgen/.github/.github/workflows/verify-actions-lock.yml@3ff2219047016d816714783fa5cc6263c2b53ebb
